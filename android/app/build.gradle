plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.shoppinglist.app'
    compileSdk 37

    defaultConfig {
        applicationId 'br.com.shoppinglist'
        minSdk 21
        targetSdk 37
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            def props = new java.util.Properties()
            def propsFile = rootProject.file('signing/signing.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file("signing/${props.getProperty('storeFile', 'shopping-list-release.jks')}")
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias', 'shoppinglist')
                keyPassword props.getProperty('keyPassword')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}
