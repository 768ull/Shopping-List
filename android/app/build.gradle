plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.shoppinglist.app'
    compileSdk 37

    defaultConfig {
        applicationId 'br.com.shoppinglist'
        minSdk 30
        targetSdk 37
        versionCode 7
        versionName '1.0.6'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def props = new java.util.Properties()
            def propsFile = rootProject.file('signing/signing.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file("signing/${props.getProperty('storeFile', 'shopping-list-release.jks')}")
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias', 'shoppinglist')
                keyPassword props.getProperty('keyPassword')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Compress native AI libraries to reduce APK size and avoid large mobile downloads.
            useLegacyPackaging true
            // The app uses StableDiffusion and ONNX only. Keep unrelated LLM,
            // speech, and OCR native engines out of this APK.
            excludes += [
                '**/libsmollm*.so',
                '**/libwhisper_jni.so',
                '**/libbark_jni.so',
                '**/libmlkit_google_ocr_pipeline.so',
                '**/libmlkitcommonpipeline.so'
            ]
        }
        resources {
            excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'io.github.aatricks:llmedge:0.4.7.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
}
