plugins {
    id 'com.android.application'
}

// A typed Gradle task exposes its output directory to the Android Components API.
abstract class GenerateShoppingLauncherIcons extends org.gradle.api.DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getSourceFile()

    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()

    @org.gradle.api.tasks.TaskAction
    void generate() {
        def sourceFileOnDisk = sourceFile.get().asFile
        if (!sourceFileOnDisk.isFile()) {
            throw new GradleException("Missing launcher icon source: ${sourceFileOnDisk}")
        }
        def sourceImage = javax.imageio.ImageIO.read(sourceFileOnDisk)
        if (sourceImage == null) {
            throw new GradleException("Launcher icon source is not a readable PNG")
        }

        def outputRoot = outputDirectory.get().asFile
        if (!outputRoot.exists() && !outputRoot.mkdirs()) {
            throw new GradleException("Could not create launcher resource directory: ${outputRoot}")
        }
        def densitySizes = [mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192]
        densitySizes.each { density, pixels ->
            def densityDir = new File(outputRoot, "mipmap-${density}")
            if (!densityDir.exists() && !densityDir.mkdirs()) {
                throw new GradleException("Could not create launcher resource directory: ${densityDir}")
            }
            def scaled = new java.awt.image.BufferedImage(
                pixels, pixels, java.awt.image.BufferedImage.TYPE_INT_ARGB
            )
            def graphics = scaled.createGraphics()
            graphics.setRenderingHint(
                java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC
            )
            graphics.setRenderingHint(
                java.awt.RenderingHints.KEY_RENDERING,
                java.awt.RenderingHints.VALUE_RENDER_QUALITY
            )
            graphics.drawImage(sourceImage, 0, 0, pixels, pixels, null)
            graphics.dispose()
            def outputFile = new File(densityDir, 'ic_launcher_custom.png')
            if (!javax.imageio.ImageIO.write(scaled, 'png', outputFile)) {
                throw new GradleException("Could not write launcher icon: ${outputFile}")
            }
        }
    }
}

// Local Release signing is optional for CI verification. Distribution builds
// receive this file from GitHub Actions Secrets and are signed with the private key.
def releaseSigningPropertiesFile = rootProject.file('signing/signing.properties')
def releaseSigningConfigured = releaseSigningPropertiesFile.exists()

android {
    namespace 'br.com.shoppinglist.app'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.shoppinglist'
        minSdk 30
        targetSdk 36
        versionCode 13
        versionName '1.0.12'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                def props = new java.util.Properties()
                releaseSigningPropertiesFile.withInputStream { props.load(it) }
                storeFile rootProject.file("signing/${props.getProperty('storeFile', 'shopping-list-release.jks')}")
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias', 'shoppinglist')
                keyPassword props.getProperty('keyPassword')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // AGP 9.3+ enables R8 code optimization and resource shrinking together.
            optimization {
                enable = true
            }
            // The unsigned Release variant is built in CI to test R8 before the
            // private distribution key is configured. Real releases are signed.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Compress native AI libraries to reduce APK size and avoid large mobile downloads.
            useLegacyPackaging true
            // The app uses StableDiffusion and ONNX only. Keep unrelated LLM,
            // speech, and OCR native engines out of this APK.
            excludes += [
                '**/libsmollm*.so',
                '**/libwhisper_jni.so',
                '**/libbark_jni.so',
                '**/libmlkit_google_ocr_pipeline.so',
                '**/libmlkitcommonpipeline.so'
            ]
        }
        resources {
            excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}


// Register the generated bitmaps using the AGP Variant API so the
// resource merge automatically depends on the task for every build variant.
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantLauncherTask = tasks.register(
            "generate${variant.name.capitalize()}LauncherIcons",
            GenerateShoppingLauncherIcons
        ) {
            sourceFile.set(rootProject.layout.projectDirectory.file('APP_ICON_SOURCE.png'))
            outputDirectory.set(
                layout.buildDirectory.dir("generated/res/shoppingLauncher/${variant.name}")
            )
        }
        variant.sources.res?.addGeneratedSourceDirectory(
            variantLauncherTask,
            { task -> task.outputDirectory }
        )
    }
}


dependencies {
    implementation 'io.github.aatricks:llmedge:0.4.7.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
}
