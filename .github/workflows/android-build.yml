name: Build Shopping List APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número de versão (deve aumentar a cada atualização)"
        required: true
        default: "1"
      version_name:
        description: "Nome da versão"
        required: true
        default: "1.0"
      changelog:
        description: "Notas da versão"
        required: true
        default: "Primeira versão do Shopping List."

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _project
          unzip -q Shopping_List_Project_com_Atualizador.zip -d _project
          test -f _project/ShoppingListProject/app/build.gradle
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/_project/ShoppingListProject" >> "$GITHUB_ENV"

      - name: Preparar assinatura privada
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOPPING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHOPPING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHOPPING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHOPPING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Faltam Secrets de assinatura. Consulte CONFIGURAR_APK_E_ATUALIZACOES.md."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/signing/shopping-list-release.jks"
          test -s "$PROJECT_DIR/signing/shopping-list-release.jks"
          printf 'storeFile=shopping-list-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$PROJECT_DIR/signing/signing.properties"
          chmod 600 "$PROJECT_DIR/signing/"*

      - name: Definir versão
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          source = path.read_text()
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          if code < 1 or not re.fullmatch(r"[0-9A-Za-z._+-]{1,40}", name):
              raise SystemExit("Número ou nome de versão inválido.")

          # Permite a primeira publicação quando o manifesto ainda não possui APK.
          manifest_path = pathlib.Path.cwd() / "update.json"
          if manifest_path.is_file():
              import json
              manifest = json.loads(manifest_path.read_text())
              current_code = int(manifest.get("versionCode", 0))
              has_published_apk = bool(str(manifest.get("apkUrl", "")).strip())
              if has_published_apk and code <= current_code:
                  raise SystemExit(
                      f"version_code precisa ser maior que a versão publicada ({current_code})."
                  )

          source, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {code}", source, count=1)
          source, count_name = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '" + name + "'", source, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Não foi possível atualizar versionCode/versionName.")
          path.write_text(source)
          PY

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Preparar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleRelease
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools/36.0.0" -name apksigner -type f | head -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release-files
          cp "$APK" release-files/ShoppingList.apk
          if [[ -f "$APK.idsig" ]]; then
            cp "$APK.idsig" release-files/ShoppingList.apk.idsig
          else
            echo "::error::O build não gerou o arquivo de assinatura V4 (.idsig)."
            exit 1
          fi
          sha256sum release-files/ShoppingList.apk | awk '{print $1}' > release-files/sha256.txt

      - name: Publicar Release com APK e assinatura V4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          target_commitish: main
          name: Shopping List v${{ inputs.version_name }}
          body: ${{ inputs.changelog }}
          files: |
            release-files/ShoppingList.apk
            release-files/ShoppingList.apk.idsig
            release-files/sha256.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Atualizar manifesto de atualização
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          CHANGELOG: ${{ inputs.changelog }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(cat release-files/sha256.txt)"
          APK_URL="https://github.com/$REPOSITORY/releases/download/v$VERSION_NAME/ShoppingList.apk"
          python3 - <<'PY'
          import json, os
          data = {
            "versionCode": int(os.environ["VERSION_CODE"]),
            "versionName": os.environ["VERSION_NAME"],
            "apkUrl": "https://github.com/" + os.environ["REPOSITORY"] + "/releases/download/v" + os.environ["VERSION_NAME"] + "/ShoppingList.apk",
            "sha256": open("release-files/sha256.txt").read().strip(),
            "changelog": os.environ["CHANGELOG"]
          }
          with open("update.json", "w") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
            f.write("\n")
          PY

      - name: Salvar manifesto na branch main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza manifesto do Shopping List v${{ inputs.version_name }}"
          file_pattern: update.json
