name: Build Shopping Lists APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número de versão inteiro e maior que o publicado"
        required: true
        default: "7"
      version_name:
        description: "Nome da versão (ex.: 1.0)"
        required: true
        default: "1.0.6"
      changelog:
        description: "Notas da versão"
        required: true
        default: "Reconhecimento semântico local de produtos, geração local de adesivos kawaii, modelos baixados separadamente e catálogo Unicode automático."

concurrency:
  group: shopping-list-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$GITHUB_WORKSPACE/android/app/build.gradle" && ( -f "$GITHUB_WORKSPACE/android/settings.gradle" || -f "$GITHUB_WORKSPACE/android/settings.gradle.kts" ) ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/android"
            APP_DIR="$PROJECT_DIR/app"
            APP_BUILD_FILE="$APP_DIR/build.gradle"
            echo "Usando fontes Android versionadas em android/."
          else
            ARCHIVE="$GITHUB_WORKSPACE/Shopping_List_Project_com_Atualizador.zip"
            EXTRACT_DIR="$GITHUB_WORKSPACE/_project"
            test -s "$ARCHIVE"
            unzip -tq "$ARCHIVE"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

            mapfile -t APP_BUILDS < <(find "$EXTRACT_DIR" -type f -path '*/app/build.gradle' -not -path '*/build/*' | sort)
            if [[ "${#APP_BUILDS[@]}" -ne 1 ]]; then
              echo "::error::Esperava encontrar exatamente um app/build.gradle; encontrei ${#APP_BUILDS[@]}."
              exit 1
            fi
            APP_BUILD_FILE="${APP_BUILDS[0]}"
            APP_DIR="$(dirname "$APP_BUILD_FILE")"
            PROJECT_DIR=""
            candidate="$(dirname "$APP_DIR")"
            while [[ "$candidate" == "$EXTRACT_DIR"* ]]; do
              if [[ -f "$candidate/settings.gradle" || -f "$candidate/settings.gradle.kts" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
              [[ "$candidate" == "$EXTRACT_DIR" ]] && break
              candidate="$(dirname "$candidate")"
            done
            if [[ -z "$PROJECT_DIR" ]]; then
              echo "::error::Não encontrei settings.gradle ou settings.gradle.kts acima do módulo app."
              exit 1
            fi
            echo "Usando projeto extraído do ZIP."
          fi

          RELATIVE_MODULE="${APP_DIR#"$PROJECT_DIR"/}"
          APP_MODULE_PATH=":$(printf '%s' "$RELATIVE_MODULE" | tr '/' ':')"
          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_DIR=$APP_DIR"
            echo "APP_BUILD_FILE=$APP_BUILD_FILE"
            echo "APP_MODULE_PATH=$APP_MODULE_PATH"
          } >> "$GITHUB_ENV"

          echo "Projeto Android: $PROJECT_DIR"
          echo "Módulo: $APP_MODULE_PATH"

      - name: Preparar e validar assinatura privada
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOPPING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHOPPING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHOPPING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHOPPING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Faltam Secrets de assinatura. A chave do ZIP é de desenvolvimento e está exposta no repositório público. Consulte CONFIGURAR_APK_E_ATUALIZACOES.md."
            exit 1
          fi

          SIGNING_DIR="$PROJECT_DIR/signing"
          mkdir -p "$SIGNING_DIR"
          CI_KEYSTORE_PATH="$SIGNING_DIR/shopping-list-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CI_KEYSTORE_PATH"
          test -s "$CI_KEYSTORE_PATH"
          keytool -list -keystore "$CI_KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          printf 'storeFile=shopping-list-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$SIGNING_DIR/signing.properties"
          chmod 600 "$CI_KEYSTORE_PATH" "$SIGNING_DIR/signing.properties"
          echo "CI_KEYSTORE_PATH=$CI_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Definir versão do aplicativo
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          code_text = os.environ["VERSION_CODE"].strip()
          name = os.environ["VERSION_NAME"].strip()
          if not re.fullmatch(r"[1-9][0-9]*", code_text):
              raise SystemExit("version_code precisa ser um inteiro positivo.")
          if not re.fullmatch(r"[0-9A-Za-z._+-]{1,40}", name):
              raise SystemExit("version_name inválido. Use somente letras, números, ponto, _, + e -.")

          manifest_path = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "update.json"
          if not manifest_path.is_file():
              raise SystemExit("update.json não foi encontrado.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          current_code = int(manifest.get("versionCode", 0))
          has_published_apk = bool(str(manifest.get("apkUrl", "")).strip())
          build_file = pathlib.Path(os.environ["APP_BUILD_FILE"])
          source = build_file.read_text(encoding="utf-8")
          current_match = re.search(r"(\bversionCode\s*(?:=\s*)?)(\d+)", source)
          if current_match is None:
              raise SystemExit("Não encontrei versionCode no app/build.gradle.")
          source_code = int(current_match.group(2))
          requested_code = int(code_text)
          if requested_code < source_code:
              raise SystemExit(f"version_code não pode ser menor que a versão-base do projeto ({source_code}).")
          if has_published_apk and requested_code <= current_code:
              raise SystemExit(f"version_code precisa ser maior que a versão publicada ({current_code}).")

          source, code_count = re.subn(
              r"(\bversionCode\s*(?:=\s*)?)\d+",
              lambda m: m.group(1) + code_text,
              source,
              count=1,
          )
          source, name_count = re.subn(
              r"""(\bversionName\s*(?:=\s*)?)(['"])[^'"]*\2""",
              lambda m: m.group(1) + m.group(2) + name + m.group(2),
              source,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Não encontrei exatamente uma definição de versionCode e versionName.")
          build_file.write_text(source, encoding="utf-8")
          print(f"Versão configurada: {name} ({code}).")
          print("A assinatura Release usa signingConfigs.release do projeto, configurada com signing.properties.")
          PY

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar plataforma Android e ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar, verificar assinatura e gerar checksum
        shell: bash
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.SHOPPING_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.SHOPPING_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.SHOPPING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -f "$PROJECT_DIR/gradlew" ]]; then
            chmod +x "$PROJECT_DIR/gradlew"
            GRADLE_CMD=("$PROJECT_DIR/gradlew")
          else
            GRADLE_CMD=(gradle)
          fi

          "${GRADLE_CMD[@]}" --no-daemon --stacktrace -p "$PROJECT_DIR" "$APP_MODULE_PATH:assembleRelease"

          mapfile -t APK_FILES < <(find "$APP_DIR/build/outputs/apk" -type f -path '*/release/*.apk' ! -name '*-unsigned.apk' ! -name '*androidTest*' 2>/dev/null | sort)
          if [[ "${#APK_FILES[@]}" -ne 1 ]]; then
            echo "::error::Esperava exatamente um APK Release, encontrei ${#APK_FILES[@]}."
            find "$APP_DIR/build/outputs" -maxdepth 7 -type f -print 2>/dev/null || true
            exit 1
          fi

          APK="${APK_FILES[0]}"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p release-files
          cp "$APK" release-files/ShoppingList.apk
          unzip -tq release-files/ShoppingList.apk
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_STORED
          apk = "release-files/ShoppingList.apk"
          with ZipFile(apk) as archive:
              broken = archive.testzip()
              if broken:
                  raise SystemExit(f"APK corrompido: {broken}")
              native = [item for item in archive.infolist() if item.filename.startswith("lib/") and item.filename.endswith(".so")]
              if not native:
                  raise SystemExit("APK não contém bibliotecas nativas.")
              stored = [item.filename for item in native if item.compress_type == ZIP_STORED]
              if stored:
                  raise SystemExit("Bibliotecas nativas continuam sem compressão: " + ", ".join(stored[:5]))
          BADGING="$("$AAPT" dump badging release-files/ShoppingList.apk)"
          printf '%s\n' "$BADGING" | grep -F "package: name='br.com.shoppinglist' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'30'"
          printf '%s\n' "$BADGING" | grep -F "native-code: 'arm64-v8a'"
          if [[ ! -s "$APK.idsig" ]]; then
            echo "::error::A assinatura V4 não foi gerada. Verifique a configuração Android Gradle do módulo."
            exit 1
          fi
          cp "$APK.idsig" release-files/ShoppingList.apk.idsig

          "$APKSIGNER" verify --verbose --print-certs release-files/ShoppingList.apk 2>&1 | tee release-files/signature-report.txt
          for scheme in v1 v2 v3; do
            if ! grep -Eiq "Verified using ${scheme} scheme.*: true" release-files/signature-report.txt; then
              echo "::error::A assinatura ${scheme^^} não foi confirmada."
              exit 1
            fi
          done

          sha256sum release-files/ShoppingList.apk | awk '{print $1}' > release-files/sha256.txt
          echo "APK validado. Assinatura V4 confirmada pela presença do arquivo .idsig."

      - name: Guardar APK como artefato de compilação
        uses: actions/upload-artifact@v4
        with:
          name: ShoppingList-APK-${{ inputs.version_name }}
          path: |
            release-files/ShoppingList.apk
            release-files/ShoppingList.apk.idsig
            release-files/sha256.txt
            release-files/signature-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Preparar notas da versão
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CHANGELOG" > release-files/CHANGELOG.md

      - name: Publicar Release com APK e assinatura V4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          target_commitish: main
          name: Shopping Lists v${{ inputs.version_name }}
          body_path: release-files/CHANGELOG.md
          files: |
            release-files/ShoppingList.apk
            release-files/ShoppingList.apk.idsig
            release-files/sha256.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Atualizar manifesto de atualização
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          CHANGELOG: ${{ inputs.changelog }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path("release-files/ShoppingList.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/download/v{os.environ['VERSION_NAME']}/ShoppingList.apk",
              "sha256": digest,
              "changelog": os.environ["CHANGELOG"],
          }
          serialized = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          Path("update.json").write_text(serialized, encoding="utf-8")
          Path("android/update.json").write_text(serialized, encoding="utf-8")
          PY

      - name: Salvar manifesto na branch main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza manifesto do Shopping Lists v${{ inputs.version_name }}"
          file_pattern: update.json android/update.json
