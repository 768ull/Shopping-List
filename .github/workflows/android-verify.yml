name: Verify Shopping List Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Configure Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android :app:assembleDebug
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p verification-output
          cp "$APK" verification-output/ShoppingList-debug.apk
          sha256sum verification-output/ShoppingList-debug.apk > verification-output/sha256.txt

      - name: Upload verified Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShoppingList-Debug-APK
          path: verification-output/*
          if-no-files-found: error
          retention-days: 14
