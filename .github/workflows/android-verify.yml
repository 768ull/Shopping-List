name: Verify Shopping Lists Release

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"
  schedule:
    - cron: "17 4 */5 * *"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"

permissions:
  contents: read

concurrency:
  group: shopping-list-release-verification
  cancel-in-progress: true

jobs:
  release-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Platform 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile and verify optimized Release variant
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace -p android :app:assembleRelease

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          MAPPING="android/app/build/outputs/mapping/release/mapping.txt"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          test -s "$APK"
          test -s "$MAPPING"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          EXPECTED_VERSION_CODE="$(grep -m1 -oE 'versionCode[[:space:]]+[0-9]+' android/app/build.gradle | grep -oE '[0-9]+')"
          EXPECTED_VERSION_NAME="$(grep -m1 -oE "versionName[[:space:]]+'[^']+'" android/app/build.gradle | sed -E "s/versionName[[:space:]]+'//; s/'$//")"
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -F "package: name='br.com.shoppinglist' versionCode='${EXPECTED_VERSION_CODE}' versionName='${EXPECTED_VERSION_NAME}'"
          printf '%s\\n' "$BADGING" | grep -F "sdkVersion:'30'"
          printf '%s\\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          printf '%s\\n' "$BADGING" | grep -F "native-code: 'arm64-v8a'"

          if [[ "$EXPECTED_VERSION_NAME" == *debug* ]]; then
            echo "::error::A versão Release não pode conter a marcação debug."
            exit 1
          fi

          MANIFEST_TREE="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          if printf '%s\\n' "$MANIFEST_TREE" | grep -Eiq 'android:debuggable.*=(true|0xffffffff)'; then
            echo "::error::O APK Release está marcado como debuggable."
            exit 1
          fi

          "$ZIPALIGN" -c -v 4 "$APK"
          unzip -tq "$APK"

          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_STORED

          apk = "android/app/build/outputs/apk/release/app-release-unsigned.apk"
          with ZipFile(apk) as archive:
              broken = archive.testzip()
              if broken:
                  raise SystemExit(f"APK corrompido: {broken}")
              native = [
                  item for item in archive.infolist()
                  if item.filename.startswith("lib/") and item.filename.endswith(".so")
              ]
              if not native:
                  raise SystemExit("APK Release não contém bibliotecas nativas.")
              stored = [item.filename for item in native if item.compress_type == ZIP_STORED]
              if stored:
                  raise SystemExit(
                      "Bibliotecas nativas continuam sem compressão: "
                      + ", ".join(stored[:5])
                  )
          PY

          echo "Release otimizado validado com R8."
          echo "Pacote: br.com.shoppinglist"
          echo "Versão: $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
          echo "Este job é somente uma verificação: o APK sem assinatura não é distribuído nem instalável."
          du -h "$APK"
