name: Atualizar catálogo Unicode Emoji

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-unicode-emoji.yml"
      - "tools/update_unicode_emoji.py"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unicode-emoji-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Unicode e gerar catálogo
        run: python tools/update_unicode_emoji.py

      - name: Publicar alterações do catálogo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/emoji/emoji_catalog_pt.tsv
          git add android/app/src/main/assets/emoji/emoji_catalog_manifest.json
          if git diff --cached --quiet; then
            echo "O catálogo Unicode já está atualizado."
            exit 0
          fi
          git commit -m "Atualiza catálogo oficial Unicode Emoji"
          git pull --rebase origin main
          git push origin HEAD:main
