name: Build Shopping List AAB - Run 58

on:
  push:
    branches:
      - build-aab-run58
    paths:
      - ".github/workflows/build-aab-run58.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source from successful run 58
        uses: actions/checkout@v4
        with:
          ref: 4c37aa500783c14237c1b25929e631ff5ca8f447

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure Release signing when private key exists
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOPPING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHOPPING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHOPPING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHOPPING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            mkdir -p android/signing
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/shopping-list-release.jks
            keytool -list -keystore android/signing/shopping-list-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            printf 'storeFile=shopping-list-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/signing/signing.properties
            chmod 600 android/signing/shopping-list-release.jks android/signing/signing.properties
            echo "SIGNED_RELEASE: private repository signing key used." > release-files/SIGNING_STATUS.txt
          else
            sed -i '/signingConfig signingConfigs.release/d' android/app/build.gradle
            echo "UNSIGNED_RELEASE: configure SHOPPING_KEYSTORE_BASE64, SHOPPING_KEYSTORE_PASSWORD, SHOPPING_KEY_ALIAS and SHOPPING_KEY_PASSWORD to sign before Play Store upload." > release-files/SIGNING_STATUS.txt
          fi

      - name: Compile AAB from exact run 58 source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android :app:bundleRelease
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab release-files/ShoppingList-Run58.aab
          sha256sum release-files/ShoppingList-Run58.aab | awk '{print $1}' > release-files/sha256.txt
          echo "Source commit: 4c37aa500783c14237c1b25929e631ff5ca8f447; versionCode 5; versionName 1.0.4" > release-files/SOURCE.txt

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShoppingList-AAB-Run58
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
